name: docker-sync

on:
  repository_dispatch:
      types: [sync]
  workflow_dispatch:
      inputs:
          count:
              description: "Maximum number of missing images to build and push"
              default: "40"
              required: false
  schedule:
    - cron: "45 23 * * */2"

env:
    COUNT: ${{ github.event.inputs.count || '24' }}

jobs:
    docker-sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/setup-python@v5

              with:

                  python-version: "3.12"
            - run: pip install requests ratelimit
            - uses: actions/checkout@v4
              with:
                  ref: master
            - run: python satex.py list > list.local
            - run: python .github/workflows/list-docker-images.py > list.docker
              env:
                  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
                  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
            - name: diff
              run: |
                wc -l list.*
                python -c "new=set(open('list.local').read().splitlines());old=set(open('list.docker').read().splitlines());print('\n'.join(list(new.difference(old))))" |shuf|head -n "${COUNT}" > list.diff
                cat list.diff
                echo HAS_CHANGES=`test -s list.diff && echo 1 || echo 0` >> $GITHUB_ENV
            - name:  build
              if: env.HAS_CHANGES == 1
              run: |
                set -ex
                docker login -u "${DOCKER_USERNAME}" -p "${DOCKER_PASSWORD}"
                for x in `cat list.diff`; do
                    python satex.py build $x
                    docker push satex/$x
                done
              env:
                  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
                  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
