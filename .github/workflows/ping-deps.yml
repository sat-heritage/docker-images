name: ping-deps

on:
  repository_dispatch:
      types: [deps]
  schedule:
    - cron: "0 10 5 * *"

jobs:
    ping-deps:
        # Pinned: the ubuntu-latest label moves to Ubuntu 26 between 19 October and
        # 19 November 2026, whose Docker 29.4.2 blocks the socketcall syscall that the
        # i386 glibc of our oldest images uses, leaving those builds without network.
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/setup-python@v6

              with:

                  python-version: "3.12"
            - run: pip install requests
            - uses: actions/checkout@v5
              with:
                  ref: master
            - run: python satex.py image-deps --pull


