name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: the ubuntu-latest label moves to Ubuntu 26 between 19 October and
    # 19 November 2026, whose Docker 29.4.2 blocks the socketcall syscall that the
    # i386 glibc of our oldest images uses, leaving those builds without network.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_metadata.py
