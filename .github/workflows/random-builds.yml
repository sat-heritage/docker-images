name: random-builds

on:
  schedule:
    - cron: "45 11 * * 1,3,5"

jobs:
    random-builds:
        # Pinned: the ubuntu-latest label moves to Ubuntu 26 between 19 October and
        # 19 November 2026, whose Docker 29.4.2 blocks the socketcall syscall that the
        # i386 glibc of our oldest images uses, leaving those builds without network.
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/setup-python@v6

              with:

                  python-version: "3.12"
            - uses: actions/checkout@v5
              with:
                  ref: master
            - run: python satex.py list | grep -v ':2018' | shuf | head -n 10 > list
            - name:  build-and-test
              run: |
                set -ex
                for x in `cat list`; do
                    python satex.py build $x
                    python satex.py test $x
                done
