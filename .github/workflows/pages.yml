name: website

on:
  push:
    branches: [master]
  workflow_run:
    # refresh the Docker Hub badges after images were pushed
    workflows: [docker-push, docker-sync]
    types: [completed]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned: the ubuntu-latest label moves to Ubuntu 26 between 19 October and
    # 19 November 2026, whose Docker 29.4.2 blocks the socketcall syscall that the
    # i386 glibc of our oldest images uses, leaving those builds without network.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Inventory of the catalogue images published on Docker Hub
        run: python tools/check_dockerhub.py --output data/dockerhub.json
      - name: Usage counters (Docker Hub pulls, release downloads)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/collect_stats.py --output data/stats.json
      - run: python tools/build_site.py --output site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    # Pinned: the ubuntu-latest label moves to Ubuntu 26 between 19 October and
    # 19 November 2026, whose Docker 29.4.2 blocks the socketcall syscall that the
    # i386 glibc of our oldest images uses, leaving those builds without network.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
